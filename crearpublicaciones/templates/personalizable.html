{% extends 'encabezado.html' %}

{% block content %}
<div class="editor-page">
    <p class="kicker">Borrador · {{ categoria.descripcion_corta }}</p>
    <h1 contenteditable="true" id="title" data-placeholder="Escribe el título"></h1>
    <p class="editor-help">Escribe seguido. Enter abre otro párrafo. La barra cambia el formato donde está el cursor.</p>

    <div class="doc-bar" role="toolbar" aria-label="Formato" data-warm-group>
        <button type="button" data-format="p" data-tip="Texto normal" aria-pressed="false">Párrafo</button>
        <button type="button" data-format="h2" data-tip="Título de sección" aria-pressed="false">Subtítulo</button>
        <button type="button" data-format="h3" data-tip="Título menor" aria-pressed="false">Apartado</button>
        <button type="button" data-format="ul" data-tip="Lista con viñetas" aria-pressed="false">Lista</button>
        <button type="button" data-format="blockquote" data-tip="Frase destacada" aria-pressed="false">Cita</button>
        <button type="button" data-format="img" data-tip="Insertar una foto">Imagen</button>
        <input id="doc-image" type="file" accept="image/*" hidden>
    </div>

    <div id="editor" class="doc" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Texto"></div>

    <button type="button" class="save-button" onclick="saveContent()">Guardar borrador</button>
    <button type="button" class="btn" id="send-review" hidden>Enviar a revisión</button>
    <p id="editor-status" class="status" role="status"></p>
    <p id="editor-next" hidden><a href="{% url 'mis_publicaciones' %}">Ver mis textos</a></p>
</div>

<script>
    const editor = document.getElementById("editor");
    const imageInput = document.getElementById("doc-image");
    const toolbar = document.querySelector(".doc-bar");
    const header = document.querySelector(".site-header");

    function pinToolbar() {
        if (!header || !toolbar) return;
        toolbar.style.top = (header.offsetHeight + 8) + "px";
    }
    pinToolbar();
    if (header && "ResizeObserver" in window) new ResizeObserver(pinToolbar).observe(header);
    const firstLine = document.createElement("p");
    editor.appendChild(firstLine);

    function textOf(node) {
        return (node.innerText || "").replace(/\u00a0/g, " ").replace(/\n+/g, " ").trim();
    }

    function placeCaret(node, atEnd) {
        if (!node.firstChild) node.appendChild(document.createElement("br"));
        const range = document.createRange();
        range.selectNodeContents(node);
        range.collapse(!atEnd);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }

    function placeCaretOffset(node, offset) {
        if (!node.firstChild) node.appendChild(document.createTextNode(""));
        const text = node.firstChild;
        const range = document.createRange();
        range.setStart(text, Math.max(0, Math.min(offset, text.textContent.length)));
        range.collapse(true);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }

    function fade(node) {
        node.classList.add("is-new");
        node.addEventListener("animationend", function done() {
            node.classList.remove("is-new");
        }, { once: true });
    }

    function currentUnit() {
        const selection = window.getSelection();
        if (!selection.rangeCount) return null;
        let node = selection.anchorNode;
        if (!node || !editor.contains(node)) return null;
        if (node === editor) return editor.firstElementChild;
        if (node.nodeType === 3) node = node.parentElement;
        const item = node.closest("li");
        if (item && editor.contains(item)) return item;
        const figure = node.closest(".doc-figure");
        if (figure && editor.contains(figure)) return figure;
        while (node.parentElement && node.parentElement !== editor) node = node.parentElement;
        return node === editor ? null : node;
    }

    function topBlock() {
        const unit = currentUnit();
        if (!unit) return null;
        return unit.tagName === "LI" ? unit.parentElement : unit;
    }

    function caretAtStart(node) {
        const selection = window.getSelection();
        if (!selection.isCollapsed || !selection.rangeCount) return false;
        const range = selection.getRangeAt(0);
        if (!node.contains(range.startContainer)) return false;
        const probe = range.cloneRange();
        probe.selectNodeContents(node);
        probe.setEnd(range.startContainer, range.startOffset);
        return probe.toString().length === 0;
    }

    function splitText(block) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return "";
        const range = selection.getRangeAt(0);
        if (!block.contains(range.startContainer)) return "";
        const tailRange = range.cloneRange();
        tailRange.selectNodeContents(block);
        tailRange.setStart(range.endContainer, range.endOffset);
        const tail = tailRange.toString();
        range.setEnd(tailRange.endContainer, tailRange.endOffset);
        range.deleteContents();
        block.textContent = block.textContent;
        return tail;
    }

    function markToolbar() {
        const top = topBlock();
        const name = top ? top.tagName : "";
        document.querySelectorAll(".doc-bar [data-format]").forEach(function (button) {
            const format = button.dataset.format;
            const on = (format === "p" && name === "P")
                || (format === "h2" && name === "H2")
                || (format === "h3" && name === "H3")
                || (format === "ul" && name === "UL")
                || (format === "blockquote" && name === "BLOCKQUOTE");
            button.setAttribute("aria-pressed", on ? "true" : "false");
        });
    }

    function applyFormat(kind) {
        if (kind === "img") {
            const selection = window.getSelection();
            imageInput.savedRange = selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
            imageInput.click();
            return;
        }
        let top = topBlock();
        if (!top || !editor.contains(top)) {
            top = editor.querySelector("p, h2, h3, blockquote, ul");
            if (!top) {
                top = document.createElement("p");
                editor.appendChild(top);
            }
            placeCaret(top.tagName === "UL" ? (top.querySelector("li") || top) : top, true);
        }
        if (top.classList.contains("doc-figure")) return;
        if (kind === "ul") {
            if (top.tagName === "UL") return;
            const ul = document.createElement("ul");
            const li = document.createElement("li");
            li.textContent = textOf(top);
            ul.appendChild(li);
            top.replaceWith(ul);
            placeCaret(li, true);
            markToolbar();
            return;
        }
        if (top.tagName === "UL") {
            const items = Array.from(top.children);
            let first = null;
            const fragment = document.createDocumentFragment();
            items.forEach(function (item) {
                const el = document.createElement(kind);
                el.textContent = textOf(item);
                if (!first) first = el;
                fragment.appendChild(el);
            });
            if (!first) {
                first = document.createElement(kind);
                fragment.appendChild(first);
            }
            top.replaceWith(fragment);
            placeCaret(first, true);
            markToolbar();
            return;
        }
        if (top.tagName.toLowerCase() === kind) return;
        const next = document.createElement(kind);
        next.textContent = textOf(top);
        top.replaceWith(next);
        placeCaret(next, true);
        markToolbar();
    }

    function insertBreak() {
        const unit = currentUnit();
        if (!unit) {
            const line = document.createElement("p");
            editor.appendChild(line);
            fade(line);
            placeCaret(line, false);
            return;
        }
        if (unit.classList.contains("doc-figure")) {
            const line = document.createElement("p");
            unit.after(line);
            fade(line);
            placeCaret(line, false);
            return;
        }
        if (unit.tagName === "LI") {
            const list = unit.parentElement;
            if (!textOf(unit)) {
                const line = document.createElement("p");
                if (list.children.length === 1) list.replaceWith(line);
                else {
                    unit.remove();
                    list.after(line);
                }
                fade(line);
                placeCaret(line, false);
                markToolbar();
                return;
            }
            const tail = splitText(unit);
            const item = document.createElement("li");
            item.textContent = tail;
            unit.after(item);
            fade(item);
            placeCaret(item, false);
            return;
        }
        if (!textOf(unit) && unit.tagName !== "P") {
            const line = document.createElement("p");
            unit.replaceWith(line);
            placeCaret(line, false);
            markToolbar();
            return;
        }
        const tail = splitText(unit);
        const line = document.createElement("p");
        line.textContent = tail;
        unit.after(line);
        fade(line);
        placeCaret(line, false);
        markToolbar();
    }

    function previousUnit(unit) {
        if (unit.tagName === "LI" && unit.previousElementSibling) return unit.previousElementSibling;
        const top = unit.tagName === "LI" ? unit.parentElement : unit;
        return top.previousElementSibling;
    }

    function mergeBackward(event) {
        const unit = currentUnit();
        if (!unit || unit.classList.contains("doc-figure")) return;
        const selection = window.getSelection();
        if (!selection.isCollapsed || !caretAtStart(unit)) return;
        const previous = previousUnit(unit);
        if (!previous && !textOf(unit)) {
            event.preventDefault();
            return;
        }
        if (!previous) return;
        event.preventDefault();
        if (previous.classList.contains("doc-figure")) {
            previous.remove();
            return;
        }
        const incoming = textOf(unit);
        const destination = previous.tagName === "UL" ? previous.lastElementChild : previous;
        const join = textOf(destination).length;
        destination.textContent = textOf(destination) + incoming;
        if (unit.tagName === "LI") {
            const list = unit.parentElement;
            unit.remove();
            if (!list.children.length) list.remove();
        } else {
            unit.remove();
        }
        if (!editor.firstElementChild) editor.appendChild(document.createElement("p"));
        placeCaretOffset(destination, join);
        markToolbar();
    }

    document.querySelector(".doc-bar").addEventListener("mousedown", function (event) {
        if (event.target.closest("button")) event.preventDefault();
    });

    document.querySelector(".doc-bar").addEventListener("click", function (event) {
        const button = event.target.closest("[data-format]");
        if (!button) return;
        applyFormat(button.dataset.format);
    });

    document.addEventListener("selectionchange", markToolbar);

    editor.addEventListener("keydown", function (event) {
        if ((event.metaKey || event.ctrlKey) && "biu".includes(event.key.toLowerCase())) {
            event.preventDefault();
            return;
        }
        if (event.key === "Enter") {
            event.preventDefault();
            insertBreak();
            return;
        }
        if (event.key === "Backspace") mergeBackward(event);
    });

    editor.addEventListener("paste", function (event) {
        event.preventDefault();
        const text = (event.clipboardData || window.clipboardData).getData("text/plain").replace(/\r\n?/g, "\n");
        if (!text) return;
        const lines = text.split("\n");
        const unit = currentUnit();
        if (!unit || unit.classList.contains("doc-figure")) {
            let after = unit;
            lines.forEach(function (line) {
                const paragraph = document.createElement("p");
                paragraph.textContent = line;
                if (after) after.after(paragraph);
                else editor.appendChild(paragraph);
                after = paragraph;
            });
            placeCaret(after, true);
            return;
        }
        const tail = splitText(unit);
        const make = unit.tagName === "LI" ? "li" : "p";
        unit.textContent = unit.textContent + lines[0];
        let last = unit;
        for (let index = 1; index < lines.length; index += 1) {
            const line = document.createElement(make);
            line.textContent = lines[index];
            last.after(line);
            last = line;
        }
        if (tail) {
            const rest = document.createElement(make);
            rest.textContent = tail;
            last.after(rest);
        }
        placeCaret(last, true);
        markToolbar();
    });

    editor.addEventListener("click", function (event) {
        const button = event.target.closest(".doc-remove");
        if (!button) return;
        const figure = button.closest(".doc-figure");
        const next = figure.nextElementSibling;
        figure.remove();
        if (!editor.firstElementChild) editor.appendChild(document.createElement("p"));
        const target = next && editor.contains(next) ? next : editor.firstElementChild;
        placeCaret(target.tagName === "UL" ? target.querySelector("li") : target, false);
    });

    imageInput.addEventListener("change", function () {
        const file = imageInput.files && imageInput.files[0];
        imageInput.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function () {
            const figure = document.createElement("div");
            figure.className = "doc-figure";
            figure.contentEditable = "false";
            const image = document.createElement("img");
            image.src = reader.result;
            image.alt = "Imagen";
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "doc-remove";
            remove.setAttribute("aria-label", "Quitar imagen");
            remove.textContent = "×";
            figure.append(image, remove);
            if (imageInput.savedRange && editor.contains(imageInput.savedRange.startContainer)) {
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(imageInput.savedRange);
            }
            const anchor = topBlock();
            const follow = document.createElement("p");
            if (anchor && !anchor.classList.contains("doc-figure") && !textOf(anchor) && anchor.tagName !== "UL") {
                anchor.replaceWith(figure);
            } else if (anchor) {
                anchor.after(figure);
            } else {
                editor.appendChild(figure);
            }
            figure.after(follow);
            fade(figure);
            placeCaret(follow, false);
            markToolbar();
        };
        reader.readAsDataURL(file);
    });

    function escapeHtml(value) {
        return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function serializeDocument() {
        let html = "";
        Array.from(editor.children).forEach(function (node) {
            if (node.classList.contains("doc-figure")) {
                const image = node.querySelector("img");
                const src = image ? image.getAttribute("src") : "";
                if (src && src.indexOf("data:image/") === 0 && src.indexOf("\"") === -1) {
                    html += '<img src="' + src + '" alt="Imagen">';
                }
                return;
            }
            if (node.tagName === "UL") {
                const items = Array.from(node.querySelectorAll("li")).map(textOf).filter(Boolean);
                if (!items.length) return;
                html += "<ul>" + items.map(function (item) {
                    return "<li>" + escapeHtml(item) + "</li>";
                }).join("") + "</ul>";
                return;
            }
            if (!["P", "H2", "H3", "BLOCKQUOTE"].includes(node.tagName)) return;
            const text = textOf(node);
            if (!text) return;
            const tag = node.tagName.toLowerCase();
            html += "<" + tag + ">" + escapeHtml(text) + "</" + tag + ">";
        });
        return html;
    }

    function setStatus(message, kind) {
        const status = document.getElementById('editor-status');
        status.textContent = message;
        status.classList.remove('is-error', 'is-ok');
        if (kind) status.classList.add(kind);
    }

    let publicacionId = null;

    function saveContent() {
        const saveButton = document.querySelector('.save-button');
        if (saveButton.disabled) return;
        const title = document.getElementById('title').innerText.trim();
        if (!title) {
            setStatus('Escribe un título antes de guardar.', 'is-error');
            return;
        }
        const contentHTML = serializeDocument();
        if (!contentHTML) {
            setStatus('Escribe el texto antes de guardar.', 'is-error');
            return;
        }
        saveButton.classList.add('is-busy');
        saveButton.setAttribute('aria-busy', 'true');
        saveButton.disabled = true;
        setStatus('');
        const categoriaId = {{ categoria.id }};

        const data = {
            'title': title,
            'content': contentHTML,
            'categoria_id': categoriaId
        };

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (const cookie of cookies) {
                    const cookieTrimmed = cookie.trim();
                    if (cookieTrimmed.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookieTrimmed.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
        const headers = {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
            'X-Requested-With': 'fetch'
        };

        const crear = publicacionId
            ? Promise.resolve()
            : fetch("{% url 'crear_publicacion_ajax' %}", {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ categoria_id: categoriaId })
            }).then(response => response.json().then(body => {
                if (!response.ok || !body.publicacion_id) {
                    throw new Error(body.message || 'No se pudo crear el borrador.');
                }
                publicacionId = body.publicacion_id;
            }));

        crear.then(() => fetch(`{% url 'guardar_publicacion_ajax' 0 %}`.replace('0', publicacionId), {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(data)
        })).then(response => response.json().then(body => {
            if (!response.ok || body.ok === false) {
                throw new Error(body.message || 'No se pudo guardar. Inténtalo otra vez.');
            }
            setStatus('Guardado. Puedes enviarlo a revisión.', 'is-ok');
            const next = document.getElementById('editor-next');
            if (next) next.hidden = false;
            const send = document.getElementById('send-review');
            if (send) send.hidden = false;
            saveButton.classList.remove('is-busy');
            saveButton.removeAttribute('aria-busy');
            saveButton.disabled = false;
        })).catch(error => {
            saveButton.classList.remove('is-busy');
            saveButton.removeAttribute('aria-busy');
            saveButton.disabled = false;
            setStatus(error.message || 'No se pudo guardar. Revisa tu conexión e inténtalo otra vez.', 'is-error');
        });
    }

    document.getElementById("send-review").addEventListener("click", function () {
        if (!publicacionId || this.disabled) return;
        const button = this;
        const match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
        const token = match ? decodeURIComponent(match[1]) : "";
        button.classList.add("is-busy");
        button.setAttribute("aria-busy", "true");
        button.disabled = true;
        setStatus("");
        fetch("{% url 'enviar_a_revision' 0 %}".replace("0", publicacionId), {
            method: "POST",
            headers: {
                "X-CSRFToken": token,
                "X-Requested-With": "fetch",
                "Accept": "application/json"
            }
        }).then(function (response) {
            return response.json().then(function (body) {
                if (!response.ok || body.ok === false) {
                    throw new Error(body.message || "No se pudo enviar.");
                }
                setStatus("En revisión.", "is-ok");
                button.hidden = true;
            });
        }).catch(function (error) {
            button.classList.remove("is-busy");
            button.removeAttribute("aria-busy");
            button.disabled = false;
            setStatus(error.message || "No se pudo enviar.", "is-error");
        });
    });
</script>
{% endblock %}
