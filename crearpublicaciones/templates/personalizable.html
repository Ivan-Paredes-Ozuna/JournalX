{% extends 'encabezado.html' %}

{% block content %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>

<div class="editor-page">
    <p class="kicker">Borrador · {{ categoria.descripcion_corta }}</p>
    <h1 contenteditable="true" id="title" data-placeholder="Escribe el título"></h1>
    <p class="editor-help">Agrega bloques y arrástralos para ordenarlos. Al guardar, el texto queda en borrador.</p>

    <div id="editor"></div>

    <div class="controls">
        <button type="button" onclick="addTextBlock()">Párrafo</button>
        <button type="button" onclick="addImageBlock()">Imagen</button>
        <button type="button" onclick="addHeadingBlock('H2')">Subtítulo</button>
        <button type="button" onclick="addHeadingBlock('H3')">Apartado</button>
        <button type="button" onclick="addBulletListBlock()">Lista</button>
        <button type="button" onclick="addQuoteBlock()">Cita</button>
    </div>

    <button type="button" class="save-button" onclick="saveContent()">Guardar borrador</button>
    <p id="editor-status" class="status" role="status"></p>
    <p id="editor-next" hidden><a href="{% url 'mis_publicaciones' %}">Ver mis publicaciones</a></p>
</div>

<script>
    // Inicializar Sortable para permitir arrastrar y soltar los bloques
    const editor = document.getElementById('editor');
    Sortable.create(editor, {
        animation: 150,
        handle: '.block',
        ghostClass: 'sortable-ghost'
    });

    // Función para crear un bloque de texto
    function addTextBlock() {
        const block = createBlock('<textarea placeholder="Escribe aquí..."></textarea>');
        editor.appendChild(block);
        scrollToBottom();
    }

    // Función para crear un bloque de imagen
    function addImageBlock() {
        const block = createBlock('<input type="file" accept="image/*" onchange="loadImage(event)" />');
        editor.appendChild(block);
        scrollToBottom();
    }

    // Función para crear un bloque de título (H2 o H3)
    function addHeadingBlock(headingType) {
        const fontSize = headingType === 'H2' ? '24px' : '20px';
        const block = createBlock(`<textarea placeholder="Título (${headingType})" style="font-size: ${fontSize}; font-weight: bold;"></textarea>`);
        editor.appendChild(block);
        scrollToBottom();
    }

    // Función para crear un bloque de cita
    function addQuoteBlock() {
        const block = createBlock('<textarea placeholder="Escribe una cita..." class="quote-block"></textarea>');
        editor.appendChild(block);
        scrollToBottom();
    }

    // Función para crear un bloque de lista de viñetas
    function addBulletListBlock() {
        const block = createBlock('<ul contenteditable="true" class="bullet-list"><li></li></ul>');
        editor.appendChild(block);
        scrollToBottom();
    }

    // Función para crear un bloque genérico con un botón de eliminar
    function createBlock(content) {
        const block = document.createElement('div');
        block.classList.add('block');
        block.innerHTML = content + `<button class="delete-btn" onclick="deleteBlock(this)">X</button>`;
        return block;
    }

    // Función para eliminar un bloque
    function deleteBlock(button) {
        const block = button.parentNode;
        block.remove();
    }

    // Función para cargar y mostrar una imagen seleccionada por el usuario
    function loadImage(event) {
        const block = event.target.parentNode;
        const reader = new FileReader();
        reader.onload = function () {
            block.innerHTML = `<div class="resizable"><img src="${reader.result}" alt="Imagen"></div>
                               <button class="delete-btn" onclick="deleteBlock(this)">X</button>`;
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    // Función para guardar el contenido en la base de datos
    function scrollToBottom() {
        window.scrollTo(0, document.body.scrollHeight);
    }

    function setStatus(message, kind) {
        const status = document.getElementById('editor-status');
        status.textContent = message;
        status.classList.remove('is-error', 'is-ok');
        if (kind) status.classList.add(kind);
    }

    let publicacionId = null;

    function saveContent() {
        const saveButton = document.querySelector('.save-button');
        if (saveButton.disabled) return;
        const title = document.getElementById('title').innerText.trim();
        if (!title) {
            setStatus('Escribe un título antes de guardar.', 'is-error');
            return;
        }
        if (!editor.children.length) {
            setStatus('Agrega al menos un párrafo antes de guardar.', 'is-error');
            return;
        }
        saveButton.disabled = true;
        saveButton.textContent = 'Guardando…';
        setStatus('Guardando el borrador…');
        const categoriaId = {{ categoria.id }};
        const blocks = editor.children;
        let contentHTML = '';

        for (let block of blocks) {
            if (block.querySelector('textarea')) {
                let content = block.querySelector('textarea').value;
                let style = block.querySelector('textarea').style.cssText;
                if (block.querySelector('.quote-block')) {
                    contentHTML += `<blockquote>${content}</blockquote>`;
                } else if (style.includes('font-size: 24px')) {
                    contentHTML += `<h2>${content}</h2>`;
                } else if (style.includes('font-size: 20px')) {
                    contentHTML += `<h3>${content}</h3>`;
                } else {
                    contentHTML += `<p>${content}</p>`;
                }
            } else if (block.querySelector('.resizable')) {
                let src = block.querySelector('img').src;
                contentHTML += `<img src="${src}" alt="Imagen">`;
            } else if (block.querySelector('ul')) {
                let listHTML = block.querySelector('ul').outerHTML;
                contentHTML += listHTML;
            }
        }

        const data = {
            'title': title,
            'content': contentHTML,
            'categoria_id': categoriaId
        };

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (const cookie of cookies) {
                    const cookieTrimmed = cookie.trim();
                    if (cookieTrimmed.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookieTrimmed.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
        const headers = {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
            'X-Requested-With': 'fetch'
        };

        const crear = publicacionId
            ? Promise.resolve()
            : fetch("{% url 'crear_publicacion_ajax' %}", {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ categoria_id: categoriaId })
            }).then(response => response.json().then(body => {
                if (!response.ok || !body.publicacion_id) {
                    throw new Error(body.message || 'No se pudo crear el borrador.');
                }
                publicacionId = body.publicacion_id;
            }));

        crear.then(() => fetch(`{% url 'guardar_publicacion_ajax' 0 %}`.replace('0', publicacionId), {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(data)
        })).then(response => response.json().then(body => {
            if (!response.ok || body.ok === false) {
                throw new Error(body.message || 'No se pudo guardar. Inténtalo otra vez.');
            }
            setStatus('Guardado. Puedes seguir editando.', 'is-ok');
            const next = document.getElementById('editor-next');
            if (next) next.hidden = false;
            saveButton.disabled = false;
            saveButton.textContent = 'Guardar borrador';
        })).catch(error => {
            saveButton.disabled = false;
            saveButton.textContent = 'Guardar borrador';
            setStatus(error.message || 'No se pudo guardar. Revisa tu conexión e inténtalo otra vez.', 'is-error');
        });
    }
</script>
{% endblock %}
