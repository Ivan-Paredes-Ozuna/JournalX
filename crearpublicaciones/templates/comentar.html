{% extends 'encabezado.html' %}

{% block title %}Comentar · Journal X{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 680px;">
    <p class="kicker">Comentario</p>
    <h1>Escribir un comentario</h1>
    <p class="lede">Sobre «{{ publicacion.titulo }}», de {{ publicacion.user.username }}.</p>
    <form method="post" action="{% url 'comentario' publicacion.id %}">
        {% csrf_token %}
        <label for="comment">Tu comentario</label>
        <textarea id="comment" name="descripcion" rows="5" required></textarea>
        <p class="hint">Se publica con tu nombre de usuario.</p>
        <div class="actions" style="margin-top: 16px;">
            <button type="submit">Publicar comentario</button>
            <a class="btn-ghost" href="{% url 'previsualizar_publicacion' publicacion.id %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
