{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar publicación · Journal X</title>
    <link rel="shortcut icon" href="{% static 'css/favicon.ico' %}">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Yanone+Kaffeesatz:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/journalx.css' %}">
</head>
<body class="gate-body">
    <main class="gate">
        <p class="kicker">Confirmación</p>
        <h1>Eliminar</h1>
        <p>Esta publicación se borra para todos. No se puede recuperar desde la interfaz.</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <button type="submit" class="btn-danger">Eliminar publicación</button>
                <a class="btn-ghost" href="javascript:history.back()">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
