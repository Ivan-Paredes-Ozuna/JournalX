{% extends 'encabezado.html' %}
{% load custom_filters %}

{% block title %}Inicio · Journal X{% endblock %}

{% block content %}
<header class="page-head">
    <div>
        <p class="kicker">Textos</p>
        <h1>Inicio</h1>
        <p>Abre un texto para leerlo completo.</p>
    </div>
    <button type="button" class="btn-ghost" id="filter-toggle" aria-expanded="{% if keyword or categoria or fecha or autor %}true{% else %}false{% endif %}" aria-controls="filtros">Filtrar</button>
</header>

<div class="chips" id="filter-summary" aria-live="polite"></div>

<section id="filtros" class="filters {% if keyword or categoria or fecha or autor %}is-open{% endif %}">
    <form id="search-filters" action="{% url 'search' %}" method="get">
        <div class="filter-grid">
            <div>
                <label for="keyword">Palabras</label>
                <input type="search" id="keyword" name="keyword" value="{{ keyword|default:'' }}">
            </div>
            <div>
                <label for="categoria">Categoría</label>
                <select id="categoria" name="category">
                    <option value="">Todas</option>
                    {% for cat in categorias %}
                        <option value="{{ cat.descripcion_corta }}" {% if categoria == cat.descripcion_corta %}selected{% endif %}>{{ cat.descripcion_corta }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="fecha">Desde</label>
                <input type="date" id="fecha" name="date-from" value="{{ fecha|default:'' }}">
            </div>
            <div>
                <label for="autor">Autor</label>
                <select id="autor" name="autor">
                    <option value="">Cualquiera</option>
                    {% for i in autores %}
                        <option value="{{ i.username }}" {% if autor == i.username %}selected{% endif %}>{{ i.username }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="actions" style="margin-top: 14px;">
            <button type="submit">Aplicar filtros</button>
            <a class="btn-ghost" id="clear-filters" href="{% url 'home' %}">Quitar filtros</a>
        </div>
    </form>
</section>

<div id="resultados">
    {% include "rol/_resultados.html" %}
</div>
<p id="resultados-status" class="status" role="status"></p>

<script>
    const filterToggle = document.getElementById("filter-toggle");
    const filterPanel = document.getElementById("filtros");
    filterToggle.addEventListener("click", function () {
        const open = filterPanel.classList.toggle("is-open");
        filterToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    function removeFilter(id) {
        document.getElementById(id).value = "";
        window.pintarFiltros();
        document.getElementById("search-filters").requestSubmit();
    }

    window.pintarFiltros = function () {
        const keyword = document.getElementById("keyword").value;
        const categoria = document.getElementById("categoria").value;
        const fecha = document.getElementById("fecha").value;
        const autor = document.getElementById("autor").value;
        const summary = document.getElementById("filter-summary");
        summary.replaceChildren();
        const items = [];
        if (keyword) items.push(["keyword", keyword]);
        if (categoria) items.push(["categoria", categoria]);
        if (fecha) items.push(["fecha", "Desde " + fecha]);
        if (autor) items.push(["autor", autor]);
        items.forEach(function (item) {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.append(document.createTextNode(item[1]));
            const button = document.createElement("button");
            button.type = "button";
            button.setAttribute("aria-label", "Quitar " + item[1]);
            button.textContent = "×";
            button.addEventListener("click", function () { removeFilter(item[0]); });
            chip.append(button);
            summary.append(chip);
        });
    };

    document.querySelectorAll("#search-filters input, #search-filters select").forEach(function (item) {
        item.addEventListener("change", window.pintarFiltros);
    });
    window.pintarFiltros();
</script>
{% endblock %}
